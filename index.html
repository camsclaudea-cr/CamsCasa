<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3B2260">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hoy en casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --verde:#3DD68C; --morado:#A77BFF; --azul:#4A9EFF; --ambar:#FFC44D;
  --hecho:#3DD68C;
  --blanco:#FFFFFF; --suave:rgba(255,255,255,.62); --tenue:rgba(255,255,255,.38);
  --carta:rgba(255,255,255,.055); --borde:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--blanco);
  background:#131A33;
  background-image:linear-gradient(178deg,#4A2570 0%,#332661 22%,#1E2550 52%,#131C38 78%,#0D1428 100%);
  background-attachment:fixed;
  font:16px/1.4 "Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.marco{max-width:520px;margin:0 auto;padding:28px 18px 60px;touch-action:pan-y}
.quien{
  display:flex;align-items:center;justify-content:flex-end;gap:7px;
  font:600 12px/1 "Inter",sans-serif;color:var(--suave);margin-bottom:14px;
}
.quien b{width:8px;height:8px;border-radius:50%;display:inline-block}
.quien i{font-style:normal;color:var(--tenue);font-weight:500}
.cab{display:flex;align-items:center;justify-content:space-between;gap:16px}
.fecha{
  font:700 11px/1 "JetBrains Mono",monospace;color:var(--tenue);
  letter-spacing:.06em;margin:10px 0 0;
}
h1{
  font:800 34px/1 "Bricolage Grotesque","Inter",sans-serif;letter-spacing:-.03em;
  margin:0;text-transform:lowercase;cursor:pointer;
}
.brujula{display:flex;gap:5px;flex:0 0 auto}
.brujula b{width:16px;height:3px;border-radius:99px;background:rgba(255,255,255,.16);transition:background .2s}
.brujula b.aqui{background:var(--blanco)}
.brujula b.es-hoy{background:var(--ambar);opacity:.4}
.brujula b.aqui.es-hoy{background:var(--ambar);opacity:1}
.sub{
  font:700 11px/1 "JetBrains Mono",monospace;color:var(--tenue);
  letter-spacing:.08em;text-transform:uppercase;margin:11px 0 0;
  display:flex;align-items:center;gap:8px;
}
.vista{
  margin-left:auto;font:600 11px/1 "Inter",sans-serif;letter-spacing:.04em;
  color:var(--suave);background:transparent;border:1px solid rgba(255,255,255,.18);
  border-radius:99px;padding:6px 12px;cursor:pointer;text-transform:none;
}
.vista:hover{color:var(--blanco);border-color:rgba(255,255,255,.4)}
.bloque.dia{cursor:pointer}
.bloque.dia h2{color:var(--blanco);letter-spacing:.1em}
.compacto .t{padding:10px 13px 10px 17px;margin-bottom:6px}
.compacto .n{font-size:15px}
.hoy-etq{color:var(--ambar);border:1px solid currentColor;border-radius:99px;padding:2px 6px;font-size:9px}

.filtros{display:flex;gap:7px;margin:20px 0 22px;flex-wrap:wrap}
.q{
  font:600 13px/1 "Inter",sans-serif;border-radius:99px;padding:8px 14px 9px;
  border:1px solid rgba(255,255,255,.16);background:transparent;cursor:pointer;
  color:var(--suave);transition:background .15s,color .15s,border-color .15s;
}
.q.f0{color:var(--verde)} .q.f1{color:var(--morado)} .q.f2{color:var(--azul)}
.q[aria-pressed="true"]{background:currentColor;border-color:currentColor}
.q[aria-pressed="true"] span{color:#141B33;font-weight:700}
.q span{display:block}

#lista{will-change:transform}
.entra-der{animation:der .22s ease-out}
.entra-izq{animation:izq .22s ease-out}
@keyframes der{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes izq{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}

.bloque{display:flex;align-items:center;gap:11px;margin:26px 0 11px}
#lista > .bloque:first-child{margin-top:4px}
.bloque h2{
  font:700 11px/1 "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;
  color:var(--suave);margin:0;
}
.bloque .raya{flex:1;height:1px;background:rgba(255,255,255,.10)}
.bloque .c{font:700 10px/1 "JetBrains Mono",monospace;color:var(--tenue);letter-spacing:.06em}
.bloque .aviso{
  font:700 9px/1 "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ambar);border:1px solid currentColor;border-radius:99px;padding:3px 6px;
}
.t{
  display:grid;grid-template-columns:1fr 20px;gap:12px;align-items:center;
  width:100%;text-align:left;font:inherit;color:var(--blanco);cursor:pointer;
  background:var(--carta);border:1px solid var(--borde);border-radius:15px;
  padding:14px 15px 14px 19px;margin-bottom:9px;
  transition:opacity .2s,background .2s,border-color .2s,transform .12s;
}
.t:active{transform:scale(.985)}
.t .n{font-weight:500;font-size:16.5px;letter-spacing:-.01em}
.t .v{font:700 13px/1 "Inter",sans-serif;color:var(--hecho);opacity:0;justify-self:end}
.t .v.col{
  opacity:1;width:20px;height:20px;border-radius:50%;color:#101728;
  font:800 11px/20px "Inter",sans-serif;text-align:center;
}
.c0{background:var(--verde)} .c1{background:var(--morado)} .c2{background:var(--azul)}

.plato{
  display:block;font:500 12.5px/1.35 "Inter",sans-serif;color:var(--suave);
  margin-top:5px;padding-left:13px;position:relative;
}
.plato::before{content:"";position:absolute;left:2px;top:6px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6}
.plato u{text-decoration:none;border-bottom:1px dotted rgba(255,255,255,.3);cursor:pointer}
.t.ok .plato{color:var(--tenue)}

.plato.hueco{color:var(--tenue)}
.plato.hueco u{border-bottom-style:dashed}

#elegir{position:fixed;inset:0;z-index:59;display:none;align-items:flex-end;background:rgba(6,10,22,.75)}
#elegir.ver{display:flex}
#elegir .caja{
  width:100%;height:88vh;display:flex;flex-direction:column;background:#1A2138;
  border-radius:20px 20px 0 0;padding:22px 18px 18px;border-top:1px solid rgba(255,255,255,.12);
}
#elegir h3{font:800 20px/1.15 "Bricolage Grotesque","Inter",sans-serif;margin:0 0 14px;letter-spacing:-.02em;text-transform:lowercase}
#elegir .modo{display:flex;gap:6px;margin-bottom:12px}
#elegir .modo button{
  flex:1;padding:9px;border-radius:10px;border:1px solid rgba(255,255,255,.16);
  background:transparent;color:var(--suave);font:600 13px "Inter",sans-serif;cursor:pointer;
}
#elegir .modo button[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#0D1428}
#elegir input{
  width:100%;padding:11px 13px;margin-bottom:10px;border-radius:11px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);
  color:var(--blanco);font:500 15px "Inter",sans-serif;
}
#elegir input:focus{outline:none;border-color:rgba(255,255,255,.45)}
#elegir .temps{display:flex;gap:5px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
#elegir .temps::-webkit-scrollbar{display:none}
#elegir .temps button{
  flex:0 0 auto;padding:6px 11px;border-radius:99px;border:1px solid rgba(255,255,255,.15);
  background:transparent;color:var(--tenue);font:600 12px "Inter",sans-serif;cursor:pointer;
}
#elegir .temps button[aria-pressed="true"]{color:var(--blanco);border-color:var(--blanco)}
#elista{flex:1;overflow:auto;margin:2px -4px 0;padding:0 4px}
#elista button{
  display:block;width:100%;text-align:left;margin-bottom:6px;padding:11px 13px;
  border-radius:11px;border:1px solid var(--borde);background:var(--carta);
  color:var(--blanco);font:500 15px "Inter",sans-serif;cursor:pointer;
}
#elista button small{display:block;font:500 11.5px "Inter",sans-serif;color:var(--tenue);margin-top:5px}
#ecat{display:flex;gap:5px;margin-bottom:11px}
#ecat button{
  flex:0 0 auto;padding:6px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.15);
  background:transparent;color:var(--tenue);font:600 12px "Inter",sans-serif;cursor:pointer;
}
#ecat button[aria-pressed="true"]{color:var(--blanco);border-color:var(--blanco)}
#elista button.sugerido{border-color:rgba(255,196,77,.45);background:rgba(255,196,77,.07)}
#elista .grupo{
  display:block;font:700 9px/1 "JetBrains Mono",monospace;letter-spacing:.13em;
  text-transform:uppercase;color:var(--tenue);margin:9px 0 5px;
}
#elista .grupo:first-child{margin-top:0}
#elista .lin{display:block;font:500 14.5px/1.35 "Inter",sans-serif;margin-bottom:4px}
#elista .lin:last-of-type{margin-bottom:0}
#elista .lin em{
  font-style:normal;font:700 9px/1 "JetBrains Mono",monospace;letter-spacing:.12em;
  text-transform:uppercase;color:var(--tenue);margin-right:8px;vertical-align:1px;
}
#elegir .pie2{display:flex;gap:8px;margin-top:12px}
#elegir .pie2 button{
  flex:1;padding:12px;border-radius:11px;border:1px solid rgba(255,255,255,.18);
  background:transparent;color:var(--suave);font:600 13.5px "Inter",sans-serif;cursor:pointer;
}
#receta .cambiar{width:100%;margin-top:18px;padding:13px;border:none;border-radius:12px;
  background:var(--azul);color:#0D1428;font:700 14px "Inter",sans-serif;cursor:pointer}

#receta{position:fixed;inset:0;z-index:58;display:none;align-items:flex-end;background:rgba(6,10,22,.75)}
#receta.ver{display:flex}
#receta .caja{
  width:100%;max-height:82vh;overflow:auto;background:#1A2138;border-radius:20px 20px 0 0;
  padding:24px 20px 30px;border-top:1px solid rgba(255,255,255,.12);
}
#receta h3{font:800 21px/1.15 "Bricolage Grotesque","Inter",sans-serif;margin:0 0 3px;letter-spacing:-.02em}
#receta .cuando{font:700 10px/1 "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ambar);margin:0 0 18px}
#receta h4{font:700 10px/1 "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--tenue);margin:20px 0 7px}
#receta p{font:400 14.5px/1.55 "Inter",sans-serif;color:var(--suave);margin:0;white-space:pre-line}
#receta .nota{font-size:13px;color:var(--tenue);margin-top:16px;padding-top:14px;border-top:1px solid var(--borde)}
#receta .cerrar{width:100%;margin-top:22px;padding:13px;border:1px solid rgba(255,255,255,.18);
  background:transparent;border-radius:12px;color:var(--suave);font:600 14px "Inter",sans-serif;cursor:pointer}

#colabora{position:fixed;inset:0;z-index:55;display:none;align-items:flex-end;background:rgba(6,10,22,.72)}
#colabora.ver{display:flex}
#colabora .caja{
  width:100%;background:#1A2138;border-radius:20px 20px 0 0;padding:22px 20px 26px;
  border-top:1px solid rgba(255,255,255,.12);
}
#colabora h3{font:600 15px/1.3 "Inter",sans-serif;margin:0 0 4px;color:var(--blanco)}
#colabora p{font:500 12px/1.3 "Inter",sans-serif;color:var(--tenue);margin:0 0 18px}
#colabora .op{
  display:flex;align-items:center;gap:11px;width:100%;margin-bottom:8px;padding:13px 15px;
  border-radius:13px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);
  color:var(--blanco);font:600 15px "Inter",sans-serif;cursor:pointer;text-align:left;
}
#colabora .op b{width:22px;height:22px;border-radius:50%;color:#101728;font:800 12px/22px "Inter",sans-serif;text-align:center}
#colabora .op i{margin-left:auto;font-style:normal;font:500 11px "Inter",sans-serif;color:var(--tenue)}
#nuevo{position:fixed;inset:0;z-index:62;display:none;align-items:flex-end;background:rgba(6,10,22,.78)}
#nuevo.ver{display:flex}
#nuevo .caja{width:100%;max-height:88vh;overflow:auto;background:#1A2138;border-radius:20px 20px 0 0;
  padding:24px 20px 26px;border-top:1px solid rgba(255,255,255,.12)}
#nuevo h3{font:800 20px/1.15 "Bricolage Grotesque","Inter",sans-serif;margin:0 0 16px;letter-spacing:-.02em;text-transform:lowercase}
#nuevo label{display:block;font:700 9.5px/1 "JetBrains Mono",monospace;letter-spacing:.12em;
  text-transform:uppercase;color:var(--tenue);margin:14px 0 6px}
#nuevo input,#nuevo textarea{width:100%;padding:11px 13px;border-radius:11px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);
  color:var(--blanco);font:500 15px/1.45 "Inter",sans-serif;resize:vertical}
#nuevo textarea{min-height:70px}
#nuevo input:focus,#nuevo textarea:focus{outline:none;border-color:rgba(255,255,255,.45)}
#nuevo .fila{display:flex;gap:5px;flex-wrap:wrap}
#nuevo .fila button{padding:7px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.15);
  background:transparent;color:var(--tenue);font:600 12px "Inter",sans-serif;cursor:pointer}
#nuevo .fila button[aria-pressed="true"]{color:var(--blanco);border-color:var(--blanco)}
#nuevo .ok2{width:100%;margin-top:22px;padding:14px;border:none;border-radius:12px;
  background:var(--azul);color:#0D1428;font:700 15px "Inter",sans-serif;cursor:pointer}
#nuevo .no2{width:100%;margin-top:8px;padding:13px;border:1px solid rgba(255,255,255,.18);
  border-radius:12px;background:transparent;color:var(--suave);font:600 14px "Inter",sans-serif;cursor:pointer}
#nfallo{color:#FF8080;font:500 13px "Inter",sans-serif;margin:12px 0 0;min-height:18px}

#elegir .crear{width:100%;margin-top:8px;padding:11px;border-radius:11px;
  border:1px dashed rgba(255,255,255,.3);background:transparent;color:var(--suave);
  font:600 13px "Inter",sans-serif;cursor:pointer}
#guardarDia{
  display:none;width:100%;margin:18px 0 0;padding:13px;border-radius:12px;
  border:1px dashed rgba(255,255,255,.22);background:transparent;color:var(--tenue);
  font:600 13.5px "Inter",sans-serif;cursor:pointer;
}
#guardarDia.ver{display:block}
#guardarDia:hover{color:var(--blanco);border-color:rgba(255,255,255,.5)}

#acompana{position:fixed;inset:0;z-index:61;display:none;align-items:flex-end;background:rgba(6,10,22,.78)}
#acompana.ver{display:flex}
#acompana .caja{width:100%;background:#1A2138;border-radius:20px 20px 0 0;padding:24px 20px 26px;border-top:1px solid rgba(255,255,255,.12)}
#acompana h3{font:800 20px/1.15 "Bricolage Grotesque","Inter",sans-serif;margin:0 0 6px;letter-spacing:-.02em}
#acompana p{font:400 14.5px/1.5 "Inter",sans-serif;color:var(--suave);margin:0 0 20px}
#acompana p b{color:var(--blanco);font-weight:600}
#acompana .ok2{width:100%;margin-bottom:8px;padding:14px;border:none;border-radius:12px;
  background:var(--azul);color:#0D1428;font:700 15px "Inter",sans-serif;cursor:pointer}
#acompana .no2{width:100%;padding:13px;border:1px solid rgba(255,255,255,.18);border-radius:12px;
  background:transparent;color:var(--suave);font:600 14px "Inter",sans-serif;cursor:pointer}

#colabora .no{width:100%;margin-top:6px;padding:12px;border:none;background:none;color:var(--tenue);font:500 13px "Inter",sans-serif;cursor:pointer}
/* fondo sólido: el color no puede depender del degradado que pase por detrás */
.p0{background:#1B3B2F;border-color:#27503F;box-shadow:inset 4px 0 0 var(--verde)}
.p1{background:#312350;border-color:#443266;box-shadow:inset 4px 0 0 var(--morado)}
.p2{background:#1D3350;border-color:#2A4569;box-shadow:inset 4px 0 0 var(--azul)}
.t.sigue{border:1.5px solid rgba(255,255,255,.85);padding:13.5px 15px}
/* Hecha: se apaga el fondo pero la franja se queda, para saber de quién era. */
.t.ok{background:#181C2B;border-color:rgba(255,255,255,.05)}
.t.ok .n{color:var(--tenue);text-decoration:line-through;text-decoration-thickness:1.5px}
.t.ok .v{opacity:1}
.vacio{color:var(--tenue)}
#acceso{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;justify-content:center;
  padding:32px 26px;background:#131A33;
  background-image:linear-gradient(178deg,#4A2570 0%,#332661 30%,#1E2550 65%,#0D1428 100%);}
#acceso.ver{display:flex}
#acceso h2{font:800 30px/1 "Bricolage Grotesque","Inter",sans-serif;letter-spacing:-.03em;margin:0 0 26px;text-transform:lowercase}
#acceso input{width:100%;margin-bottom:10px;padding:14px 16px;border-radius:13px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);
  color:var(--blanco);font:500 16px "Inter",sans-serif}
#acceso input:focus{outline:none;border-color:rgba(255,255,255,.5)}
#acceso button{width:100%;margin-top:8px;padding:15px;border:none;border-radius:13px;
  background:var(--azul);color:#0D1428;font:700 16px "Inter",sans-serif;cursor:pointer}
#fallo{color:#FF8080;font:500 13px "Inter",sans-serif;margin:12px 0 0;min-height:18px}
#imprimir{
  display:none;width:100%;margin:26px 0 0;padding:14px;border-radius:13px;
  border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--suave);
  font:600 14px "Inter",sans-serif;cursor:pointer;
}
#imprimir.ver{display:block}
#imprimir:hover{color:var(--blanco);border-color:rgba(255,255,255,.45)}

#previa{position:fixed;inset:0;z-index:60;background:#0B0F1E;display:none;flex-direction:column}
#previa.ver{display:flex}
#previa .barra{
  display:flex;gap:10px;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);flex:0 0 auto;
}
#previa .barra span{font:600 13px "Inter",sans-serif;color:var(--suave)}
#previa .barra button{
  padding:9px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.2);
  background:transparent;color:var(--suave);font:600 13px "Inter",sans-serif;cursor:pointer;
}
#previa .barra button.ok{background:var(--azul);border-color:var(--azul);color:#0D1428}
#lienzo{flex:1;overflow:auto;padding:16px}

#hoja{
  width:1050px;background:#fff;color:#111;padding:14px 16px;
  transform-origin:top left;font-family:"Inter",system-ui,sans-serif;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
#hoja .tit{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px}
#hoja h1{font:800 26px/1 "Bricolage Grotesque","Inter",sans-serif;margin:0;text-transform:lowercase;letter-spacing:-.02em;color:#111}
#hoja .tit em{font-style:normal;font:600 13px "Inter",sans-serif;color:#777}
#hoja .clave{display:flex;gap:12px;margin-left:auto}
#hoja .clave span{display:flex;align-items:center;gap:5px;font:700 15px/1 "Inter",sans-serif}
#hoja .clave i{width:16px;height:16px;border-radius:3px;display:inline-block;color:#fff;font:800 11px/16px "Inter",sans-serif;text-align:center}

#hoja .rejilla{display:grid;grid-template-columns:repeat(7,1fr);gap:0 5px;align-items:start}
#hoja .dia{
  font:700 15px/1.1 "Inter",sans-serif;text-transform:uppercase;letter-spacing:.05em;
  padding:0 0 5px;border-bottom:2px solid #333;
}
#hoja .banda{
  grid-column:1/-1;font:800 13px/1 "Inter",sans-serif;text-transform:uppercase;letter-spacing:.16em;
  color:#111;margin:9px 0 5px;padding:4px 0 4px 6px;background:#ECEFEC;border-left:4px solid #333;
}
#hoja .caja{min-height:4px}
#hoja .l{
  display:flex;gap:5px;align-items:flex-start;
  font:400 15px/1.2 "Inter",sans-serif;margin:0 0 2px;padding:2px 5px 2px 3px;
  border-radius:3px;border-left:4px solid;
}
#hoja .l b{
  flex:0 0 auto;width:16px;height:16px;border-radius:3px;color:#fff;
  font:800 11px/16px "Inter",sans-serif;text-align:center;
}
#hoja .h0{background:#EAF5EE;border-color:#137344} #hoja .h0 b{background:#137344}
#hoja .h1{background:#F2E9FD;border-color:#6B3BC9} #hoja .h1 b{background:#6B3BC9}
#hoja .h2{background:#DFE9F6;border-color:#134A8E} #hoja .h2 b{background:#134A8E}
#hoja .pie{margin-top:10px;font:400 11px/1.3 "Inter",sans-serif;color:#777}
@page{size:A4 landscape;margin:9mm}
@media print{
  body{background:#fff}
  .marco,#acceso,#previa .barra{display:none!important}

<script>
// ============================================================
//  Las tareas ya no viven aquí: se piden a la base con tareas_de(fecha).
//  Este archivo solo pinta lo que le llega.
// ============================================================
const SB = supabase.createClient(
  "https://bvembbhfvcboowusdgkc.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2ZW1iYmhmdmNib293dXNkZ2tjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MDAzODMsImV4cCI6MjEwMjk3NjM4M30.L0vxmVcU4rPDwkZshxuxzvsoCFhHg2vVNozJj5oby5E");

const DIAS=["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
const BLOQUES=["General","Mañana","Mediodía","Noche"];
const NBLOQUE={general:0,manana:1,mediodia:2,noche:3};
const ORDEN={"#3DD68C":0,"#A77BFF":1,"#4A9EFF":2};   // verde, morado, azul

// En España toISOString() de la medianoche local devuelve el día anterior.
const iso=(d)=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const hoy=(new Date().getDay()+6)%7;
const LUNES=(()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-hoy);return d;})();
const fechaDia=(i)=>new Date(LUNES.getTime()+i*864e5);
const fechaISO=(i)=>iso(fechaDia(i));
const fechaDe=(i)=>fechaDia(i).toLocaleDateString("es",{day:"numeric",month:"long",year:"numeric"});

let dia=hoy, semana=false, quien=-1;
try{const f=localStorage.getItem("casa:quien"); if(f!==null) quien=+f;}catch(e){}

let PERSONAS=[null,null,null], NOMBRES=["—","—","—"];
let SEM=[[],[],[],[],[],[],[]];
let yo=null, yoIdx=-1, giro=null;

// ---------- traer de la base ----------

async function cargarPersonas(){
  const {data,error}=await SB.from("personas").select("id,nombre,color,admin");
  if(error||!data) return;
  PERSONAS=[null,null,null];
  data.forEach(p=>{ const i=ORDEN[p.color]; if(i!==undefined) PERSONAS[i]=p; });
  NOMBRES=PERSONAS.map(p=>p?p.nombre:"—");
}

async function cargarSemana(){
  const res=await Promise.all([0,1,2,3,4,5,6].map(i=>SB.rpc("tareas_de",{f:fechaISO(i)})));
  SEM=res.map(r=>(r.data||[]).map(x=>({
    id:x.reparto_id, nombre:x.nombre, tipo:x.tipo,
    bloque:NBLOQUE[x.bloque]||0, orden:Number(x.orden),
    p:(ORDEN[x.color]!==undefined?ORDEN[x.color]:2),
    asignado:x.asignado, asignado_id:x.asignado_id,
    hecho:x.hecho, por:x.por
  })).sort((a,b)=>a.bloque-b.bloque||a.orden-b.orden));
}

// Qué se come cada día. MENU[dia].comida = [platos]
let MENU=[{},{},{},{},{},{},{}];
async function cargarMenu(){
  const {data,error}=await SB.from("menu_asignado")
    .select("fecha,momento,orden,nombre,plato(id,menu_dia_id,nombre,ingredientes,preparacion,nota)")
    .gte("fecha",fechaISO(0)).lte("fecha",fechaISO(6)).order("orden");
  MENU=[{},{},{},{},{},{},{}];
  if(error||!data) return;
  data.forEach(r=>{
    const i=[0,1,2,3,4,5,6].findIndex(k=>fechaISO(k)===r.fecha);
    if(i<0) return;
    (MENU[i][r.momento]=MENU[i][r.momento]||[]).push({
      id:     r.plato ? r.plato.id : null,
      dia:    r.plato ? r.plato.menu_dia_id : null,
      nombre: r.plato ? r.plato.nombre : (r.nombre||"Sin nombre"),
      ingredientes: r.plato ? r.plato.ingredientes : null,
      preparacion:  r.plato ? r.plato.preparacion  : null,
      nota:         r.plato ? r.plato.nota         : null
    });
  });
}

// El catálogo entero: 183 platos. Se pide una vez y se guarda.
let CATALOGO=null, DIAPLATO=[];
async function cargarCatalogo(force){
  if(CATALOGO && !force) return CATALOGO;
  const [pl,dp]=await Promise.all([
    SB.from("platos_buscables").select("id,nombre,momento,orden,ingredientes,temporada,propio"),
    SB.from("dia_plato").select("menu_dia_id,plato_id,momento,orden")
  ]);
  // Un plato puede estar en varios días: la relación vive en dia_plato.
  DIAPLATO=dp.data||[];
  CATALOGO=(pl.data||[]).map(p=>({...p,
    texto:((p.nombre||"")+" "+(p.ingredientes||"")).toLowerCase()
  }));
  return CATALOGO;
}

async function ponerPlatos(fi,momento,ids){
  const f=fechaISO(fi);
  await SB.from("menu_asignado").delete().eq("fecha",f).eq("momento",momento);
  await SB.from("menu_asignado").insert(ids.map((id,k)=>({fecha:f,momento:momento,orden:k+1,plato_id:id})));
  await cargarMenu(); pintar();
}

// Si el plato elegido tiene compañero en su día (primero y segundo), lo ofrecemos.
function elegirPlato(p){
  const dias=DIAPLATO.filter(x=>x.plato_id===p.id).map(x=>x.menu_dia_id);
  const ids=[...new Set(DIAPLATO
    .filter(x=>dias.includes(x.menu_dia_id) && x.momento===p.momento && x.plato_id!==p.id)
    .sort((a,b)=>a.orden-b.orden).map(x=>x.plato_id))];
  const hermanos=ids.map(id=>CATALOGO.find(c=>c.id===id)).filter(Boolean);
  if(!hermanos.length){ cerrarElegir(); return ponerPlatos(eFi,eMomento,[p.id]); }
  const juntos=[p,...hermanos].sort((a,b)=>a.orden-b.orden);
  document.getElementById("atitulo").textContent=p.nombre;
  document.getElementById("atexto").innerHTML="En su menú va acompañado de "+
    hermanos.map(h=>"<b>"+h.nombre+"</b>").join(" y ")+".";
  document.getElementById("ados").textContent="Poner los "+juntos.length;
  document.getElementById("ados").onclick=()=>{
    document.getElementById("acompana").classList.remove("ver");
    cerrarElegir(); ponerPlatos(eFi,eMomento,juntos.map(x=>x.id));
  };
  document.getElementById("asolo").onclick=()=>{
    document.getElementById("acompana").classList.remove("ver");
    cerrarElegir(); ponerPlatos(eFi,eMomento,[p.id]);
  };
  document.getElementById("acompana").classList.add("ver");
}
async function ponerDia(fi,menuDiaId){
  await SB.rpc("aplicar_menu",{f:fechaISO(fi),dia:menuDiaId});
  await cargarMenu(); pintar();
}
async function quitarMenu(fi,momento){
  await SB.from("menu_asignado").delete().eq("fecha",fechaISO(fi)).eq("momento",momento);
  await cargarMenu(); pintar();
}

const TEMPS=[["","Todas"],["invierno","Invierno"],["primavera","Primavera"],
             ["verano","Verano"],["otono","Otoño"],["todo","Sin temporada"]];
let eFi=0, eMomento="cena", eCat="cena", eModo="plato", eTemp="", eTexto="";

async function abrirElegir(fi,momento){
  eFi=fi; eMomento=momento; eCat=(momento==="desayuno"?"comida":momento);
  eModo="plato"; eTemp=""; eTexto="";
  document.getElementById("ebuscar").value="";
  document.getElementById("etitulo").textContent=momento+" del "+DIAS[fi];
  document.getElementById("elegir").classList.add("ver");
  await cargarCatalogo();
  pintarElegir();
}

function pintarElegir(){
  document.getElementById("mplato").setAttribute("aria-pressed",eModo==="plato");
  document.getElementById("mdia").setAttribute("aria-pressed",eModo==="dia");
  const cc=document.getElementById("ecat");
  cc.hidden=(eModo!=="plato"); cc.innerHTML="";
  if(eModo==="plato"){
    [["comida","Platos de comida"],["cena","Platos de cena"]].forEach(([v,txt])=>{
      const b=document.createElement("button");
      b.textContent=txt; b.setAttribute("aria-pressed",v===eCat);
      b.onclick=()=>{eCat=v;pintarElegir();};
      cc.appendChild(b);
    });
  }
  const tc=document.getElementById("etemps"); tc.innerHTML="";
  TEMPS.forEach(([v,txt])=>{
    const b=document.createElement("button");
    b.textContent=txt; b.setAttribute("aria-pressed",v===eTemp);
    b.onclick=()=>{eTemp=v;pintarElegir();};
    tc.appendChild(b);
  });

  const q=eTexto.trim().toLowerCase();
  const casa=(p)=>!q||p.texto.includes(q);
  const corta=(x,n)=>!x?"":(x.length>n?x.slice(0,n).replace(/[ ,]+$/,"")+"…":x);
  const TEMP={invierno:"invierno",primavera:"primavera",verano:"verano",otono:"otoño",todo:"todo el año"};
  const c=document.getElementById("elista"); c.innerHTML="";

  if(eModo==="plato"){
    // Si el otro momento ya está puesto, proponemos lo que Ángel emparejó con él.
    const otro = eMomento==="cena" ? "comida" : "cena";
    const puestos = (MENU[eFi]||{})[otro]||[];
    const suyos = [...new Set(puestos.flatMap(x=>
      DIAPLATO.filter(y=>y.plato_id===x.id).map(y=>y.menu_dia_id)))];
    if(eCat===eMomento && suyos.length){
      // fuera lo que ya está puesto en este mismo hueco: no es recomendación
      const yaEsta=((MENU[eFi]||{})[eMomento]||[]).map(x=>x.id).filter(Boolean);
      const idsPareja=[...new Set(DIAPLATO
        .filter(x=>suyos.includes(x.menu_dia_id) && x.momento===eCat && !yaEsta.includes(x.plato_id))
        .sort((a,b)=>a.orden-b.orden).map(x=>x.plato_id))];
      const pareja=idsPareja.map(id=>CATALOGO.find(c=>c.id===id)).filter(Boolean);
      if(pareja.length){
        const t=document.createElement("span");
        t.className="grupo";
        t.textContent="Va con "+puestos.map(x=>x.nombre).join(" y ");
        c.appendChild(t);
        pareja.forEach(p=>{
          const b=document.createElement("button");
          b.className="sugerido";
          b.innerHTML='<span class="lin">'+p.nombre+"</span><small>"+
            corta(p.ingredientes,90)+"</small>";
          b.onclick=()=>elegirPlato(p);
          c.appendChild(b);
        });
        const t2=document.createElement("span");
        t2.className="grupo"; t2.textContent="Todos los platos";
        c.appendChild(t2);
      }
    }

    CATALOGO.filter(p=>p.momento===eCat && (!eTemp||p.temporada===eTemp) && casa(p))
      .forEach(p=>{
        const b=document.createElement("button");
        b.innerHTML='<span class="lin">'+p.nombre+"</span><small>"+
          corta(p.ingredientes,90)+(p.ingredientes?" · ":"")+TEMP[p.temporada]+"</small>";
        b.onclick=()=>elegirPlato(p);
        c.appendChild(b);
      });
  } else {
    const dias={};
    DIAPLATO.forEach(x=>{
      const p=CATALOGO.find(c=>c.id===x.plato_id); if(!p) return;
      (dias[x.menu_dia_id]=dias[x.menu_dia_id]||{temporada:p.temporada,platos:[]})
        .platos.push({...p,momento:x.momento,orden:x.orden});
    });
    Object.entries(dias)
      .filter(([id,d])=>(!eTemp||d.temporada===eTemp) && d.platos.some(casa))
      .forEach(([id,d])=>{
        const trozo=(mom,txt)=>{
          const l=d.platos.filter(p=>p.momento===mom).sort((a,b)=>a.orden-b.orden);
          if(!l.length) return "";
          return '<span class="grupo">'+txt+"</span>"+
                 l.map(p=>'<span class="lin">'+p.nombre+"</span>").join("");
        };
        const b=document.createElement("button");
        b.innerHTML=trozo("comida","Comida")+trozo("cena","Cena")+
                    "<small>"+TEMP[d.temporada]+"</small>";
        b.onclick=()=>{cerrarElegir();ponerDia(eFi,id);};
        c.appendChild(b);
      });
  }
  if(!c.querySelector("button")) c.innerHTML='<p class="vacio">Nada con ese filtro.</p>';
}
let nMomento="cena", nTemp="todo";
const TEMPS2=[["todo","Todo el año"],["invierno","Invierno"],["primavera","Primavera"],
              ["verano","Verano"],["otono","Otoño"]];

function abrirNuevo(){
  nMomento=(eMomento==="desayuno"?"comida":eMomento); nTemp="todo";
  ["nnombre","ningr","nprep"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("nfallo").textContent="";
  pintarNuevo();
  document.getElementById("nuevo").classList.add("ver");
}
function pintarNuevo(){
  const m=document.getElementById("nmomento"); m.innerHTML="";
  [["comida","Comida"],["cena","Cena"]].forEach(([v,txt])=>{
    const b=document.createElement("button");
    b.textContent=txt; b.setAttribute("aria-pressed",v===nMomento);
    b.onclick=()=>{nMomento=v;pintarNuevo();};
    m.appendChild(b);
  });
  const t=document.getElementById("ntemp"); t.innerHTML="";
  TEMPS2.forEach(([v,txt])=>{
    const b=document.createElement("button");
    b.textContent=txt; b.setAttribute("aria-pressed",v===nTemp);
    b.onclick=()=>{nTemp=v;pintarNuevo();};
    t.appendChild(b);
  });
}

async function crearPlato(){
  const f=document.getElementById("nfallo");
  const nombre=document.getElementById("nnombre").value.trim();
  if(!nombre){ f.textContent="Ponle un nombre."; return; }
  f.textContent="Guardando…";
  const id="casa-"+Date.now().toString(36);
  const r=await SB.from("plato").insert({
    id:id, menu_dia_id:null, momento:nMomento, orden:1, propio:true,
    temporada:nTemp, nombre:nombre,
    ingredientes:document.getElementById("ningr").value.trim()||null,
    preparacion:document.getElementById("nprep").value.trim()||null
  });
  if(r.error){ f.textContent=r.error.message; return; }
  document.getElementById("nuevo").classList.remove("ver");
  cerrarElegir();
  await cargarCatalogo(true);
  await ponerPlatos(eFi,eMomento,[id]);
}

// ---------- guardar el día en la biblioteca ----------
async function guardarDia(){
  const puestos=Object.values(MENU[dia]||{}).flat();
  if(!puestos.length){ alert("Este día no tiene ningún plato puesto."); return; }
  const titulo=prompt("¿Cómo llamamos a este día?","Nuestro "+DIAS[dia]);
  if(!titulo) return;
  const {data,error}=await SB.rpc("guardar_dia",{f:fechaISO(dia),titulo:titulo});
  if(error){ alert(error.message); return; }
  const r=Array.isArray(data)?data[0]:data;
  await cargarCatalogo(true);
  alert(r.ya_existia
    ? "Esta combinación ya estaba guardada como: "+r.origen
    : "Guardado. Ya lo puedes elegir en «El día entero».");
}

function cerrarElegir(){ document.getElementById("elegir").classList.remove("ver"); }

function verReceta(pl,fi,momento){
  document.getElementById("rtitulo").textContent=pl.nombre;
  document.getElementById("rcuando").textContent=DIAS[fi]+" · "+momento;
  document.getElementById("rcambiar").onclick=()=>{
    document.getElementById("receta").classList.remove("ver");
    abrirElegir(fi,momento);
  };
  let h="";
  if(pl.ingredientes) h+="<h4>Ingredientes</h4><p>"+pl.ingredientes+"</p>";
  if(pl.preparacion)  h+="<h4>Preparación</h4><p>"+pl.preparacion+"</p>";
  if(pl.nota)         h+='<p class="nota">'+pl.nota+"</p>";
  if(!h) h='<p class="nota">Sin receta: es un plato directo.</p>';
  document.getElementById("rcuerpo").innerHTML=h;
  document.getElementById("receta").classList.add("ver");
}

async function cargarGiro(){
  const {data}=await SB.from("turnos").select("desde").gt("desde",fechaISO(6)).order("desde").limit(1);
  giro = (data&&data[0])
    ? new Date(data[0].desde+"T12:00:00").toLocaleDateString("es",{day:"numeric",month:"long"})
    : null;
}

// ---------- marcar ----------
// Se pinta al instante y, si la base rechaza, se deshace solo.

async function marcar(fi,t,poner,porNombre){
  const antes={hecho:t.hecho,por:t.por};
  t.hecho=poner; t.por=poner?porNombre:null; pintar();
  const quienLo=PERSONAS.find(p=>p&&p.nombre===porNombre);
  const r = poner
    ? await SB.from("hechos").insert({fecha:fechaISO(fi),reparto_id:t.id,
        asignado_id:t.asignado_id, por_id:quienLo?quienLo.id:null})
    : await SB.from("hechos").delete().eq("fecha",fechaISO(fi)).eq("reparto_id",t.id);
  if(r.error){ t.hecho=antes.hecho; t.por=antes.por; pintar(); }
}

// Si la tarea no es tuya, preguntamos quién la ha hecho. Si es tuya, directo.
function pulsar(fi,t){
  if(t.hecho) return marcar(fi,t,false);
  if(yoIdx===t.p) return marcar(fi,t,true,NOMBRES[t.p]);
  const caja=document.getElementById("colabora");
  document.getElementById("qtarea").textContent=t.nombre;
  const ops=document.getElementById("qopciones"); ops.innerHTML="";
  [t.p,...[0,1,2].filter(i=>i!==t.p)].forEach(i=>{
    const b=document.createElement("button");
    b.className="op";
    b.innerHTML='<b class="c'+i+'">'+NOMBRES[i][0].toUpperCase()+"</b>"+NOMBRES[i]+
      (i===t.p?'<i>le tocaba</i>':'<i>colabora</i>');
    b.onclick=()=>{caja.classList.remove("ver");marcar(fi,t,true,NOMBRES[i]);};
    ops.appendChild(b);
  });
  caja.classList.add("ver");
}

// Lo que marca otro aparece aquí solo.
function escuchar(){
  SB.channel("hechos").on("postgres_changes",
    {event:"*",schema:"public",table:"hechos"},
    ({eventType,new:n,old:v})=>{
      const m=(n&&n.fecha)?n:v; if(!m) return;
      const i=[0,1,2,3,4,5,6].findIndex(k=>fechaISO(k)===m.fecha);
      if(i<0) return;
      const t=SEM[i].find(x=>x.id===m.reparto_id); if(!t) return;
      if(eventType==="DELETE"){ t.hecho=false; t.por=null; }
      else {
        const q=PERSONAS.find(p=>p&&p.id===m.por_id);
        t.hecho=true; t.por=q?q.nombre:null;
      }
      pintar();
    }).subscribe();
}

// Los móviles cortan el websocket en segundo plano: al volver, se repregunta.
function refrescar(){ if(document.visibilityState!=="visible") return;
  Promise.all([cargarSemana(),cargarMenu()]).then(pintar); }
document.addEventListener("visibilitychange",refrescar);
setInterval(refrescar,30000);

// ---------- pintar ----------

function tarjeta(fi,t,c,sigue){
  const b=document.createElement("button");
  b.className="t p"+t.p+(t.hecho?" ok":(t.id===sigue?" sigue":""));
  const otro=(t.por && t.por!==t.asignado) ? NOMBRES.indexOf(t.por) : -1;
  const comida=(t.tipo==="comida"||t.tipo==="cena"||t.tipo==="desayuno");
  const platos=comida ? ((MENU[fi]||{})[t.tipo]||[]) : [];
  b.innerHTML='<span class="n">'+t.nombre+
    (platos.length
      ? platos.map(pl=>'<span class="plato"><u>'+pl.nombre+"</u></span>").join("")
      : (comida?'<span class="plato hueco"><u>elegir plato</u></span>':""))+
    "</span>"+
    (otro>=0 ? '<span class="v col c'+otro+'">'+NOMBRES[otro][0].toUpperCase()+"</span>"
             : '<span class="v">✓</span>');
  b.querySelectorAll(".plato u").forEach((el,k)=>{
    el.onclick=(e)=>{ e.stopPropagation();
      platos.length ? verReceta(platos[k],fi,t.tipo) : abrirElegir(fi,t.tipo); };
  });
  b.onclick=()=>pulsar(fi,t);
  c.appendChild(b);
}
function cabecera(c,txt,extra,hechas,total,alPulsar){
  const cab=document.createElement("div");
  cab.className="bloque"+(alPulsar?" dia":"");
  cab.innerHTML="<h2>"+txt+"</h2>"+(extra?'<span class="aviso">'+extra+'</span>':"")+
    '<span class="raya"></span><span class="c">'+hechas+"/"+total+"</span>";
  if(alPulsar) cab.onclick=alPulsar;
  c.appendChild(cab);
}

function pintar(anim){
  const fs=document.getElementById("filtros"); fs.innerHTML="";
  [[-1,"Todos"],[0,NOMBRES[0]],[1,NOMBRES[1]],[2,NOMBRES[2]]].forEach(([i,txt])=>{
    const b=document.createElement("button");
    b.className="q"+(i>=0?" f"+i:"");
    b.setAttribute("aria-pressed",i===quien);
    b.innerHTML="<span>"+txt+"</span>";
    b.onclick=()=>{quien=i;try{localStorage.setItem("casa:quien",String(i));}catch(e){}pintar();};
    fs.appendChild(b);
  });
  document.getElementById("vista").textContent = semana ? "Día" : "Semana";
  document.getElementById("brujula").hidden = semana;
  document.getElementById("imprimir").classList.toggle("ver",semana);
  document.getElementById("guardarDia").classList.toggle("ver",
    !semana && Object.values(MENU[dia]||{}).flat().length>0);
  const c=document.getElementById("lista");
  c.className=(semana?"compacto":"")+(anim?" "+anim:"");
  if(anim){void c.offsetWidth;}
  c.innerHTML="";
  semana ? pintarSemana(c) : pintarDia(c);
}

function pintarSemana(c){
  const todo=SEM.flat().filter(t=>quien<0||t.p===quien);
  document.getElementById("dia").textContent="semana";
  document.getElementById("cuenta").textContent=
    todo.filter(t=>t.hecho).length+" de "+todo.length+" listas";
  document.getElementById("fecha").textContent=fechaDe(0)+" — "+fechaDe(6);
  document.getElementById("etqHoy").hidden=true;
  DIAS.forEach((nom,i)=>{
    const lista=SEM[i].filter(t=>quien<0||t.p===quien);
    if(!lista.length) return;
    cabecera(c,nom,i===hoy?"hoy":"",lista.filter(t=>t.hecho).length,lista.length,
      ()=>{semana=false;dia=i;pintar();});
    lista.forEach(t=>tarjeta(i,t,c,null));
  });
  if(!c.children.length) c.innerHTML='<p class="vacio">'+NOMBRES[quien]+" no tiene turnos esta semana.</p>";
}

function pintarDia(c){
  const lista=SEM[dia].filter(t=>quien<0||t.p===quien);
  document.getElementById("dia").textContent=DIAS[dia];
  document.getElementById("cuenta").textContent=
    lista.filter(t=>t.hecho).length+" de "+lista.length+" listas";
  document.getElementById("fecha").textContent=fechaDe(dia);
  document.getElementById("etqHoy").hidden=dia!==hoy;

  const br=document.getElementById("brujula"); br.innerHTML="";
  DIAS.forEach((_,i)=>{
    const b=document.createElement("b");
    b.className=(i===dia?"aqui ":"")+(i===hoy?"es-hoy":"");
    br.appendChild(b);
  });

  if(!lista.length){c.innerHTML='<p class="vacio">'+(quien<0?"Sin turnos este día.":NOMBRES[quien]+" no tiene turnos este día.")+'</p>';return;}
  const reloj=new Date(), h=reloj.getHours()+reloj.getMinutes()/60;
  const ahora = dia===hoy ? (h<12?1:(h<17?2:3)) : -1;
  const sigue = ahora<0 ? null : (lista.find(t=>!t.hecho && t.bloque===ahora)||{}).id;

  BLOQUES.forEach((nom,bi)=>{
    const grupo=lista.filter(t=>t.bloque===bi);
    if(!grupo.length) return;
    cabecera(c,nom,bi===ahora?"ahora":"",grupo.filter(t=>t.hecho).length,grupo.length,null);
    grupo.forEach(t=>tarjeta(dia,t,c,sigue));
  });
}

// ---------- hoja para la nevera ----------

function pintarHoja(){
  const COL=["#137344","#6B3BC9","#134A8E"], ini=(i)=>NOMBRES[i][0].toUpperCase();
  let h='<div class="tit"><h1>turnos de casa</h1><em>'+fechaDe(0)+" — "+fechaDe(6)+
        '</em><span class="clave">'+
        NOMBRES.map((n,i)=>'<span><i style="background:'+COL[i]+'">'+ini(i)+"</i>"+n+"</span>").join("")+
        '</span></div><div class="rejilla">';
  DIAS.forEach(d=>{ h+='<div class="dia">'+d.slice(0,3)+"</div>"; });
  BLOQUES.forEach((nom,bi)=>{
    const fila=DIAS.map((_,i)=>SEM[i].filter(t=>t.bloque===bi));
    if(!fila.some(g=>g.length)) return;
    h+='<div class="banda">'+nom+"</div>";
    fila.forEach(g=>{
      h+='<div class="caja">'+g.map(t=>
        '<div class="l h'+t.p+'"><b>'+ini(t.p)+"</b><span>"+t.nombre+"</span></div>"
      ).join("")+"</div>";
    });
  });
  h+='</div><p class="pie">El lavavajillas lo pone quien lo vea lleno; vaciarlo tiene dueño cada día. '+
     "Quien pone la lavadora la tiende, y al recogerla se dobla."+
     (giro?" Los perfiles rotan el lunes "+giro+".":"")+"</p>";
  document.getElementById("hoja").innerHTML=h;
  const l=document.getElementById("lienzo");
  document.getElementById("hoja").style.transform="scale("+Math.min(1,(l.clientWidth-4)/1050)+")";
}

// ---------- navegación ----------

function mover(paso){
  if(semana) return;
  dia=(dia+paso+7)%7;
  pintar(paso>0?"entra-der":"entra-izq");
}
let x0=null,y0=null;
const m=document.getElementById("marco");
m.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
m.addEventListener("touchend",e=>{
  if(x0===null)return;
  const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
  if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.6) mover(dx<0?1:-1);
  x0=null;
},{passive:true});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")mover(1);
  if(e.key==="ArrowLeft")mover(-1);
});
document.getElementById("dia").onclick=()=>{
  if(semana){semana=false;pintar();return;}
  if(dia!==hoy){const p=((hoy-dia+7)%7)<4?1:-1;dia=hoy;pintar(p>0?"entra-der":"entra-izq");}
};
document.getElementById("vista").onclick=()=>{semana=!semana;pintar();window.scrollTo(0,0);};
const previa=document.getElementById("previa");
document.getElementById("imprimir").onclick=()=>{previa.classList.add("ver");pintarHoja();};
document.getElementById("cerrarPrevia").onclick=()=>previa.classList.remove("ver");
document.getElementById("lanzar").onclick=()=>window.print();
addEventListener("resize",()=>{if(previa.classList.contains("ver"))pintarHoja();});
document.getElementById("ecrear").onclick=abrirNuevo;
document.getElementById("ncancelar").onclick=()=>document.getElementById("nuevo").classList.remove("ver");
document.getElementById("nguardar").onclick=crearPlato;
document.getElementById("nuevo").onclick=(e)=>{ if(e.target.id==="nuevo") e.target.classList.remove("ver"); };
document.getElementById("guardarDia").onclick=guardarDia;
document.getElementById("mplato").onclick=()=>{eModo="plato";pintarElegir();};
document.getElementById("mdia").onclick=()=>{eModo="dia";pintarElegir();};
document.getElementById("ebuscar").oninput=(e)=>{eTexto=e.target.value;pintarElegir();};
document.getElementById("ecancelar").onclick=cerrarElegir;
document.getElementById("equitar").onclick=()=>{cerrarElegir();quitarMenu(eFi,eMomento);};
document.getElementById("elegir").onclick=(e)=>{ if(e.target.id==="elegir") cerrarElegir(); };
document.getElementById("acompana").onclick=(e)=>{ if(e.target.id==="acompana") e.target.classList.remove("ver"); };
document.getElementById("rcerrar").onclick=()=>document.getElementById("receta").classList.remove("ver");
document.getElementById("receta").onclick=(e)=>{ if(e.target.id==="receta") e.target.classList.remove("ver"); };
document.getElementById("qcancel").onclick=()=>document.getElementById("colabora").classList.remove("ver");
document.getElementById("colabora").onclick=(e)=>{
  if(e.target.id==="colabora") e.target.classList.remove("ver");
};

// ---------- acceso ----------

const pantalla=document.getElementById("acceso"), marco=document.getElementById("marco");
document.getElementById("entrar").onclick=async()=>{
  const f=document.getElementById("fallo"); f.textContent="Entrando…";
  const {error}=await SB.auth.signInWithPassword({
    email:document.getElementById("correo").value.trim(),
    password:document.getElementById("clave").value});
  f.textContent = error ? error.message : "";
};
document.getElementById("clave").addEventListener("keydown",e=>{
  if(e.key==="Enter") document.getElementById("entrar").click();});

SB.auth.onAuthStateChange(async(_e,sesion)=>{
  if(!sesion){pantalla.classList.add("ver");marco.hidden=true;return;}
  pantalla.classList.remove("ver"); marco.hidden=false;

  await cargarPersonas();
  const {data}=await SB.from("personas").select("nombre,color,admin").eq("id",sesion.user.id).single();
  if(data){
    yo=data; yoIdx=(ORDEN[data.color]!==undefined?ORDEN[data.color]:-1);
    if(yoIdx>=0){
      if(quien===-1) quien=yoIdx;
      const col=["var(--verde)","var(--morado)","var(--azul)"][yoIdx];
      document.getElementById("yo").innerHTML=
        '<b style="background:'+col+'"></b>'+data.nombre+(data.admin?" · admin":"")+' <i>· salir</i>';
      document.getElementById("yo").querySelector("i").onclick=()=>SB.auth.signOut();
    }
  }
  await cargarSemana();
  await cargarMenu();
  await cargarGiro();
  document.getElementById("giro").textContent =
    giro ? "Los perfiles rotan el lunes "+giro+"." : "";
  pintar(); escuchar();
});

(async()=>{
  const {data}=await SB.auth.getSession();
  if(!data.session) pantalla.classList.add("ver");
})();

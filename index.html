<style>
:root{
  --verde:#3DD68C; --morado:#A77BFF; --azul:#4A9EFF; --ambar:#FFC44D;
  --hecho:#3DD68C;
  --blanco:#FFFFFF; --suave:rgba(255,255,255,.62); --tenue:rgba(255,255,255,.38);
  --carta:rgba(255,255,255,.055); --borde:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--blanco);
  background:#131A33;
  background-image:linear-gradient(178deg,#4A2570 0%,#332661 22%,#1E2550 52%,#131C38 78%,#0D1428 100%);
  background-attachment:fixed;
  font:16px/1.4 "Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.marco{max-width:520px;margin:0 auto;padding:28px 18px 60px;touch-action:pan-y}
.quien{
  display:flex;align-items:center;justify-content:flex-end;gap:7px;
  font:600 12px/1 "Inter",sans-serif;color:var(--suave);margin-bottom:14px;
}
.quien b{width:8px;height:8px;border-radius:50%;display:inline-block}
.quien i{font-style:normal;color:var(--tenue);font-weight:500}
.cab{display:flex;align-items:center;justify-content:space-between;gap:16px}
.fecha{
  font:700 11px/1 "JetBrains Mono",monospace;color:var(--tenue);
  letter-spacing:.06em;margin:10px 0 0;
}
h1{
  font:800 34px/1 "Bricolage Grotesque","Inter",sans-serif;letter-spacing:-.03em;
  margin:0;text-transform:lowercase;cursor:pointer;
}
.brujula{display:flex;gap:5px;flex:0 0 auto}
.brujula b{width:16px;height:3px;border-radius:99px;background:rgba(255,255,255,.16);transition:background .2s}
.brujula b.aqui{background:var(--blanco)}
.brujula b.es-hoy{background:var(--ambar);opacity:.4}
.brujula b.aqui.es-hoy{background:var(--ambar);opacity:1}
.sub{
  font:700 11px/1 "JetBrains Mono",monospace;color:var(--tenue);
  letter-spacing:.08em;text-transform:uppercase;margin:11px 0 0;
  display:flex;align-items:center;gap:8px;
}
.vista{
  margin-left:auto;font:600 11px/1 "Inter",sans-serif;letter-spacing:.04em;
  color:var(--suave);background:transparent;border:1px solid rgba(255,255,255,.18);
  border-radius:99px;padding:6px 12px;cursor:pointer;text-transform:none;
}
.vista:hover{color:var(--blanco);border-color:rgba(255,255,255,.4)}
.bloque.dia{cursor:pointer}
.bloque.dia h2{color:var(--blanco);letter-spacing:.1em}
.compacto .t{padding:10px 13px 10px 17px;margin-bottom:6px}
.compacto .n{font-size:15px}
.hoy-etq{color:var(--ambar);border:1px solid currentColor;border-radius:99px;padding:2px 6px;font-size:9px}

.filtros{display:flex;gap:7px;margin:20px 0 22px;flex-wrap:wrap}
.q{
  font:600 13px/1 "Inter",sans-serif;border-radius:99px;padding:8px 14px 9px;
  border:1px solid rgba(255,255,255,.16);background:transparent;cursor:pointer;
  color:var(--suave);transition:background .15s,color .15s,border-color .15s;
}
.q.f0{color:var(--verde)} .q.f1{color:var(--morado)} .q.f2{color:var(--azul)}
.q[aria-pressed="true"]{background:currentColor;border-color:currentColor}
.q[aria-pressed="true"] span{color:#141B33;font-weight:700}
.q span{display:block}

#lista{will-change:transform}
.entra-der{animation:der .22s ease-out}
.entra-izq{animation:izq .22s ease-out}
@keyframes der{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes izq{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}

.bloque{display:flex;align-items:center;gap:11px;margin:26px 0 11px}
#lista > .bloque:first-child{margin-top:4px}
.bloque h2{
  font:700 11px/1 "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;
  color:var(--suave);margin:0;
}
.bloque .raya{flex:1;height:1px;background:rgba(255,255,255,.10)}
.bloque .c{font:700 10px/1 "JetBrains Mono",monospace;color:var(--tenue);letter-spacing:.06em}
.bloque .aviso{
  font:700 9px/1 "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ambar);border:1px solid currentColor;border-radius:99px;padding:3px 6px;
}
.t{
  display:grid;grid-template-columns:1fr 20px;gap:12px;align-items:center;
  width:100%;text-align:left;font:inherit;color:var(--blanco);cursor:pointer;
  background:var(--carta);border:1px solid var(--borde);border-radius:15px;
  padding:14px 15px 14px 19px;margin-bottom:9px;
  transition:opacity .2s,background .2s,border-color .2s,transform .12s;
}
.t:active{transform:scale(.985)}
.t .n{font-weight:500;font-size:16.5px;letter-spacing:-.01em}
.t .v{font:700 13px/1 "Inter",sans-serif;color:var(--hecho);opacity:0;justify-self:end}
.t .v.col{
  opacity:1;width:20px;height:20px;border-radius:50%;color:#101728;
  font:800 11px/20px "Inter",sans-serif;text-align:center;
}
.c0{background:var(--verde)} .c1{background:var(--morado)} .c2{background:var(--azul)}

#colabora{position:fixed;inset:0;z-index:55;display:none;align-items:flex-end;background:rgba(6,10,22,.72)}
#colabora.ver{display:flex}
#colabora .caja{
  width:100%;background:#1A2138;border-radius:20px 20px 0 0;padding:22px 20px 26px;
  border-top:1px solid rgba(255,255,255,.12);
}
#colabora h3{font:600 15px/1.3 "Inter",sans-serif;margin:0 0 4px;color:var(--blanco)}
#colabora p{font:500 12px/1.3 "Inter",sans-serif;color:var(--tenue);margin:0 0 18px}
#colabora .op{
  display:flex;align-items:center;gap:11px;width:100%;margin-bottom:8px;padding:13px 15px;
  border-radius:13px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);
  color:var(--blanco);font:600 15px "Inter",sans-serif;cursor:pointer;text-align:left;
}
#colabora .op b{width:22px;height:22px;border-radius:50%;color:#101728;font:800 12px/22px "Inter",sans-serif;text-align:center}
#colabora .op i{margin-left:auto;font-style:normal;font:500 11px "Inter",sans-serif;color:var(--tenue)}
#colabora .no{width:100%;margin-top:6px;padding:12px;border:none;background:none;color:var(--tenue);font:500 13px "Inter",sans-serif;cursor:pointer}
/* fondo sólido: el color no puede depender del degradado que pase por detrás */
.p0{background:#1B3B2F;border-color:#27503F;box-shadow:inset 4px 0 0 var(--verde)}
.p1{background:#312350;border-color:#443266;box-shadow:inset 4px 0 0 var(--morado)}
.p2{background:#1D3350;border-color:#2A4569;box-shadow:inset 4px 0 0 var(--azul)}
.t.sigue{border:1.5px solid rgba(255,255,255,.85);padding:13.5px 15px}
/* Hecha: se apaga el fondo pero la franja se queda, para saber de quién era. */
.t.ok{background:#181C2B;border-color:rgba(255,255,255,.05)}
.t.ok .n{color:var(--tenue);text-decoration:line-through;text-decoration-thickness:1.5px}
.t.ok .v{opacity:1}
.vacio{color:var(--tenue)}
#acceso{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;justify-content:center;

  background-image:linear-gradient(178deg,#4A2570 0%,#332661 30%,#1E2550 65%,#0D1428 100%);}
#acceso.ver{display:flex}
#acceso h2{font:800 30px/1 "Bricolage Grotesque","Inter",sans-serif;letter-spacing:-.03em;margin:0 0 26px;text-transform:lowercase}
#acceso input{width:100%;margin-bottom:10px;padding:14px 16px;border-radius:13px;

  color:var(--blanco);font:500 16px "Inter",sans-serif}
#acceso input:focus{outline:none;border-color:rgba(255,255,255,.5)}
#acceso button{width:100%;margin-top:8px;padding:15px;border:none;border-radius:13px;
  background:var(--azul);color:#0D1428;font:700 16px "Inter",sans-serif;cursor:pointer}
#fallo{color:#FF8080;font:500 13px "Inter",sans-serif;margin:12px 0 0;min-height:18px}
#imprimir{
  display:none;width:100%;margin:26px 0 0;padding:14px;border-radius:13px;
  border:1px solid rgba(255,255,255,.18);background:transparent;color:var(--suave);
  font:600 14px "Inter",sans-serif;cursor:pointer;
}
#imprimir.ver{display:block}
#imprimir:hover{color:var(--blanco);border-color:rgba(255,255,255,.45)}

#previa{position:fixed;inset:0;z-index:60;background:#0B0F1E;display:none;flex-direction:column}
#previa.ver{display:flex}
#previa .barra{
  display:flex;gap:10px;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);flex:0 0 auto;

#previa .barra span{font:600 13px "Inter",sans-serif;color:var(--suave)}

  padding:9px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.2);
  background:transparent;color:var(--suave);font:600 13px "Inter",sans-serif;cursor:pointer;
}
#previa .barra button.ok{background:var(--azul);border-color:var(--azul);color:#0D1428}
#lienzo{flex:1;overflow:auto;padding:16px}

#hoja{
  width:1050px;background:#fff;color:#111;padding:14px 16px;
  transform-origin:top left;font-family:"Inter",system-ui,sans-serif;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
#hoja .tit{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px}
#hoja h1{font:800 26px/1 "Bricolage Grotesque","Inter",sans-serif;margin:0;text-transform:lowercase;letter-spacing:-.02em;color:#111}
#hoja .tit em{font-style:normal;font:600 13px "Inter",sans-serif;color:#777}
#hoja .clave{display:flex;gap:12px;margin-left:auto}
#hoja .clave span{display:flex;align-items:center;gap:5px;font:700 15px/1 "Inter",sans-serif}
#hoja .clave i{width:16px;height:16px;border-radius:3px;display:inline-block;color:#fff;font:800 11px/16px "Inter",sans-serif;text-align:center}

#hoja .rejilla{display:grid;grid-template-columns:repeat(7,1fr);gap:0 5px;align-items:start}
#hoja .dia{
  font:700 15px/1.1 "Inter",sans-serif;text-transform:uppercase;letter-spacing:.05em;
  padding:0 0 5px;border-bottom:2px solid #333;
}
#hoja .banda{
  grid-column:1/-1;font:800 13px/1 "Inter",sans-serif;text-transform:uppercase;letter-spacing:.16em;
  color:#111;margin:9px 0 5px;padding:4px 0 4px 6px;background:#ECEFEC;border-left:4px solid #333;
}
#hoja .caja{min-height:4px}
#hoja .l{
  display:flex;gap:5px;align-items:flex-start;
  font:400 15px/1.2 "Inter",sans-serif;margin:0 0 2px;padding:2px 5px 2px 3px;
  border-radius:3px;border-left:4px solid;
}
#hoja .l b{
  flex:0 0 auto;width:16px;height:16px;border-radius:3px;color:#fff;
  font:800 11px/16px "Inter",sans-serif;text-align:center;
}
#hoja .h0{background:#EAF5EE;border-color:#137344} #hoja .h0 b{background:#137344}
#hoja .h1{background:#F2E9FD;border-color:#6B3BC9} #hoja .h1 b{background:#6B3BC9}
#hoja .h2{background:#DFE9F6;border-color:#134A8E} #hoja .h2 b{background:#134A8E}
#hoja .pie{margin-top:10px;font:400 11px/1.3 "Inter",sans-serif;color:#777}
@page{size:A4 landscape;margin:9mm}
@media print{
  body{background:#fff}
  .marco,#acceso,#previa .barra{display:none!important}
  #previa{position:static;display:block;background:#fff}
  #lienzo{overflow:visible;padding:0}
  #hoja{width:100%;transform:none!important;padding:0}
}
#salir{margin-top:18px;background:none;border:none;color:var(--tenue);
  font:500 12px "Inter",sans-serif;cursor:pointer;padding:0;text-decoration:underline}
.regla{
  margin:30px 0 0;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);
  font:400 13px/1.5 "Inter",sans-serif;color:var(--tenue);
}
.regla b{color:var(--suave);font-weight:600}
.regla p{margin:0 0 9px;padding-left:14px;position:relative}
.regla p::before{content:"·";position:absolute;left:2px;color:var(--suave)}
:focus-visible{outline:2px solid var(--blanco);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  if(hechas[id]) return marcar(id,false);
  const suya=persona(t);
  if(yoIdx===suya) return marcar(id,true,NOMBRES[suya],NOMBRES[suya]);
  const caja=document.getElementById("colabora");
  document.getElementById("qtarea").textContent=t[1];
  const ops=document.getElementById("qopciones"); ops.innerHTML="";
  const orden=[suya,...[0,1,2].filter(i=>i!==suya)];
  orden.forEach(i=>{
    const b=document.createElement("button");
    b.className="op";
    b.innerHTML='<b class="c'+i+'">'+NOMBRES[i][0].toUpperCase()+"</b>"+NOMBRES[i]+
      (i===suya?'<i>le tocaba</i>':'<i>colabora</i>');
    b.onclick=()=>{caja.classList.remove("ver");marcar(id,true,NOMBRES[i],NOMBRES[suya]);};
    ops.appendChild(b);
  });
  caja.classList.add("ver");
}

// Lo que marca otro aparece aquí solo.
// Red de seguridad: los móviles cortan el websocket al irse a segundo plano,
// así que al volver y cada 30 s se vuelve a preguntar.
function refrescar(){ if(document.visibilityState==="visible") cargar().then(pintar); }
document.addEventListener("visibilitychange",refrescar);
setInterval(refrescar,30000);

function escuchar(){
  SB.channel("marcas").on("postgres_changes",
    {event:"*",schema:"public",table:"marcas"},
    ({eventType,new:n,old:v})=>{
      const m=(n&&n.semana===lunes)?n:((v&&v.semana===lunes)?v:null);
      if(!m) return;
      eventType==="DELETE" ? delete hechas[m.tarea] : hechas[m.tarea]=(m.por||true);
      pintar();
    }).subscribe();
}

function tarjeta(t,c,sigue){
  const b=document.createElement("button");
  b.className="t p"+persona(t)+(hechas[t[4]]?" ok":(t[4]===sigue?" sigue":""));
  const v=hechas[t[4]], suyo=NOMBRES[persona(t)];
  const otro=(typeof v==="string" && v!==suyo) ? NOMBRES.indexOf(v) : -1;
  b.innerHTML='<span class="n">'+t[1]+"</span>"+
    (otro>=0 ? '<span class="v col c'+otro+'">'+NOMBRES[otro][0].toUpperCase()+"</span>"
             : '<span class="v">✓</span>');
  b.onclick=()=>pulsar(t);
  c.appendChild(b);
}
function cabecera(c,txt,extra,hechas_,total,alPulsar){
  const cab=document.createElement("div");
  cab.className="bloque"+(alPulsar?" dia":"");
  cab.innerHTML="<h2>"+txt+"</h2>"+(extra?'<span class="aviso">'+extra+'</span>':"")+
    '<span class="raya"></span><span class="c">'+hechas_+"/"+total+"</span>";
  if(alPulsar) cab.onclick=alPulsar;
  c.appendChild(cab);
}

function pintarHoja(){
  const COL=["#137344","#6B3BC9","#134A8E"], ini=(i)=>NOMBRES[i][0].toUpperCase();
  let h='<div class="tit"><h1>turnos de casa</h1><em>'+fechaDe(0)+" — "+fechaDe(6)+
        " · turno "+(turno+1)+' de 3</em><span class="clave">'+
        NOMBRES.map((n,i)=>'<span><i style="background:'+COL[i]+'">'+ini(i)+"</i>"+n+"</span>").join("")+
        '</span></div><div class="rejilla">';

  DIAS.forEach(d=>{ h+='<div class="dia">'+d.slice(0,3)+"</div>"; });

  // Una banda por bloque, cruzando los siete días: así Mañana, Mediodía
  // y Noche quedan a la misma altura en todas las columnas.
  BLOQUES.forEach((nom,bi)=>{
    const fila=DIAS.map((_,i)=>DATOS[i].filter(t=>bloque(t[3])===bi).sort((a,b)=>a[3]-b[3]));
    if(!fila.some(g=>g.length)) return;
    h+='<div class="banda">'+nom+"</div>";
    fila.forEach(g=>{
      h+='<div class="caja">'+g.map(t=>
        '<div class="l h'+persona(t)+'"><b>'+ini(persona(t))+"</b><span>"+t[1]+"</span></div>"
      ).join("")+"</div>";
    });
  });

  h+='</div><p class="pie">El lavavajillas lo pone quien lo vea lleno; vaciarlo tiene dueño cada día. '+
     "Quien pone la lavadora la tiende, y al recogerla se dobla. "+
     "Los perfiles rotan el lunes "+proximoGiro()+".</p>";
  document.getElementById("hoja").innerHTML=h;
  const l=document.getElementById("lienzo");
  document.getElementById("hoja").style.transform="scale("+Math.min(1,(l.clientWidth-4)/1050)+")";
}

function pintar(anim){
  const fs=document.getElementById("filtros"); fs.innerHTML="";
  [[-1,"Todos"],[0,NOMBRES[0]],[1,NOMBRES[1]],[2,NOMBRES[2]]].forEach(([i,txt])=>{
    const b=document.createElement("button");
    b.className="q"+(i>=0?" f"+i:"");
    b.setAttribute("aria-pressed",i===quien);
    b.innerHTML="<span>"+txt+"</span>";
    b.onclick=()=>{quien=i;try{localStorage.setItem("casa:quien",String(i));}catch(e){}pintar();};
    fs.appendChild(b);
  });
  document.getElementById("vista").textContent = semana ? "Día" : "Semana";
  document.getElementById("imprimir").classList.toggle("ver",semana);
  document.getElementById("brujula").hidden = semana;
  const c=document.getElementById("lista");
  c.className=(semana?"compacto":"")+(anim?" "+anim:"");
  if(anim){void c.offsetWidth;}
  c.innerHTML="";
  semana ? pintarSemana(c) : pintarDia(c);
}

function pintarSemana(c){
  const todo=DATOS.flat().filter(t=>quien<0||persona(t)===quien);
  document.getElementById("dia").textContent="semana";
  document.getElementById("fecha").textContent=fechaDe(0)+" — "+fechaDe(6);
  document.getElementById("cuenta").textContent=
    todo.filter(t=>hechas[t[4]]).length+" de "+todo.length+" listas";
  document.getElementById("etqHoy").hidden=true;
  DIAS.forEach((nom,i)=>{
    const lista=DATOS[i].filter(t=>quien<0||persona(t)===quien).sort((a,b)=>a[3]-b[3]);
    if(!lista.length) return;
    cabecera(c,nom,i===hoy?"hoy":"",lista.filter(t=>hechas[t[4]]).length,lista.length,
      ()=>{semana=false;dia=i;pintar();});
    lista.forEach(t=>tarjeta(t,c,null));
  });
  if(!c.children.length) c.innerHTML='<p class="vacio">'+NOMBRES[quien]+" no tiene turnos esta semana.</p>";
}

function pintarDia(c){
  const lista=DATOS[dia].filter(t=>quien<0||persona(t)===quien).sort((a,b)=>a[3]-b[3]);
  document.getElementById("dia").textContent=DIAS[dia];
  document.getElementById("fecha").textContent=fechaDe(dia);
  document.getElementById("cuenta").textContent=
    lista.filter(t=>hechas[t[4]]).length+" de "+lista.length+" listas";
  document.getElementById("etqHoy").hidden=dia!==hoy;

  const br=document.getElementById("brujula"); br.innerHTML="";
  DIAS.forEach((_,i)=>{
    const b=document.createElement("b");
    b.className=(i===dia?"aqui ":"")+(i===hoy?"es-hoy":"");
    br.appendChild(b);
  });

  if(!lista.length){c.innerHTML='<p class="vacio">'+(quien<0?"Sin turnos este día.":NOMBRES[quien]+" no tiene turnos este día.")+'</p>';return;}
  const reloj=new Date(), ahora = dia===hoy ? bloque(reloj.getHours()+reloj.getMinutes()/60) : -1;
  const sigue = ahora<0 ? null : (lista.find(t=>!hechas[t[4]] && bloque(t[3])===ahora)||[])[4];

  BLOQUES.forEach((nom,bi)=>{
    const grupo=lista.filter(t=>bloque(t[3])===bi);
    if(!grupo.length) return;
    cabecera(c,nom,bi===ahora?"ahora":"",grupo.filter(t=>hechas[t[4]]).length,grupo.length,null);
    grupo.forEach(t=>tarjeta(t,c,sigue));
  });
}

function mover(paso){
  if(semana) return;
  dia=(dia+paso+7)%7;
  pintar(paso>0?"entra-der":"entra-izq");
}

// deslizar
let x0=null,y0=null;
const m=document.getElementById("marco");
m.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
m.addEventListener("touchend",e=>{
  if(x0===null)return;
  const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
  if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.6) mover(dx<0?1:-1);
  x0=null;
},{passive:true});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")mover(1);
  if(e.key==="ArrowLeft")mover(-1);
});
document.getElementById("dia").onclick=()=>{if(semana){semana=false;pintar();return;}if(dia!==hoy){const p=((hoy-dia+7)%7)<4?1:-1;dia=hoy;pintar(p>0?"entra-der":"entra-izq");}};

document.getElementById("vista").onclick=()=>{semana=!semana;pintar();window.scrollTo(0,0);};
const previa=document.getElementById("previa");
document.getElementById("imprimir").onclick=()=>{previa.classList.add("ver");pintarHoja();};
document.getElementById("cerrarPrevia").onclick=()=>previa.classList.remove("ver");
document.getElementById("qcancel").onclick=()=>document.getElementById("colabora").classList.remove("ver");
document.getElementById("colabora").onclick=(e)=>{
  if(e.target.id==="colabora") e.target.classList.remove("ver");
};
document.getElementById("lanzar").onclick=()=>window.print();
addEventListener("resize",()=>{if(previa.classList.contains("ver"))pintarHoja();});
document.getElementById("giro").innerHTML=
  "Turno <b>"+(turno+1)+" de 3</b>. Los perfiles rotan el lunes "+proximoGiro()+": "+
  NOMBRES.map((n,i)=>n+" → "+NOMBRES[(i+1)%3]).join(", ")+".";

const pantalla=document.getElementById("acceso"), marco=document.getElementById("marco");
document.getElementById("entrar").onclick=async()=>{
  const f=document.getElementById("fallo"); f.textContent="Entrando…";
  const {error}=await SB.auth.signInWithPassword({
    email:document.getElementById("correo").value.trim(),
    password:document.getElementById("clave").value});
  f.textContent = error ? error.message : "";
};
document.getElementById("clave").addEventListener("keydown",e=>{
  if(e.key==="Enter") document.getElementById("entrar").click();});


SB.auth.onAuthStateChange(async(_e,sesion)=>{
  if(!sesion){pantalla.classList.add("ver");marco.hidden=true;return;}
  pantalla.classList.remove("ver"); marco.hidden=false;
  const {data}=await SB.from("perfiles").select("nombre,persona").eq("id",sesion.user.id).single();
  if(data){
    yo=data;
    const mio=NOMBRES.indexOf(data.nombre); yoIdx=mio;
    if(mio>=0){
      if(quien===-1) quien=mio;                       // sin filtro guardado: el tuyo
      const col=["var(--verde)","var(--morado)","var(--azul)"][mio];
      document.getElementById("yo").innerHTML=
        '<b style="background:'+col+'"></b>'+data.nombre+' <i>· salir</i>';
      document.getElementById("yo").querySelector("i").onclick=()=>SB.auth.signOut();
    }
  }
  await cargar(); pintar(); escuchar();
});
(async()=>{const {data}=await SB.auth.getSession(); if(!data.session) pantalla.classList.add("ver");})();
</script>
